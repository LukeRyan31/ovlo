<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F0E8"/>

  <!-- Blob A -->
  <ellipse cx="180" cy="180" rx="320" ry="280" fill="#D4935A" opacity="0.22"/>

  <!-- Blob B -->
  <ellipse cx="1080" cy="420" rx="260" ry="220" fill="#C4763A" opacity="0.15"/>

  <!-- Blob C -->
  <ellipse cx="700" cy="580" rx="200" ry="160" fill="#C4763A" opacity="0.10"/>

  <!-- Wordmark -->
  <text x="80" y="120" font-family="Georgia, serif" font-weight="700" font-size="72" fill="#1A1714" letter-spacing="-2">Ovlo</text>

  <!-- Divider -->
  <rect x="80" y="148" width="60" height="3" rx="2" fill="#C4763A"/>

  <!-- Headline -->
  <text x="80" y="290" font-family="Georgia, serif" font-weight="700" font-size="68" fill="#1A1714" letter-spacing="-2">Scale the brand</text>
  <text x="80" y="370" font-family="Georgia, serif" font-weight="700" font-size="68" fill="#1A1714" letter-spacing="-2">you built.</text>

  <!-- Subheading -->
