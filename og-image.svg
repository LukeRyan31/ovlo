  <text x="80" y="476" font-family="Arial, sans-serif" font-size="26" fill="#6B6560">and fitness brands.</text>

  <!-- URL pill -->
  <rect x="80" y="530" width="260" height="44" rx="22" fill="#C4763A"/>
  <text x="210" y="559" font-family="Arial, sans-serif" font-size="18" fill="#FDFBF7" text-anchor="middle" font-weight="600">ovlo.ie</text>
